{{- if not .Values.api.existingSecret }}
{{- if and .Values.postgresql.enabled .Values.postgresql.auth.existingSecret (not .Values.postgresql.connectionString) }}
{{- fail "api.existingSecret is required when postgresql.auth.existingSecret is set, so that DATABASE_URL matches the database credentials" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-key-manager.api.fullname" . }}
  labels:
    {{- include "api-key-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  DATABASE_URL: {{ include "api-key-manager.postgresql.connectionString" . | quote }}
  KEY_PEPPER: {{ .Values.api.keyPepper | quote }}
{{- end }}
