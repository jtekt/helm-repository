apiVersion: v1
kind: Service
metadata:
  name: {{ include "api-key-manager.api.fullname" . }}
  labels:
    {{- include "api-key-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "api-key-manager.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
