apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-key-manager.proxy.fullname" . }}
  labels:
    {{- include "api-key-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.proxy.replicaCount }}
  selector:
    matchLabels:
      {{- include "api-key-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        {{- include "api-key-manager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
      annotations:
        # Restart pods when the nginx configuration changes
        checksum/config: {{ include (print $.Template.BasePath "/proxy/configmap.yml") . | sha256sum }}
    spec:
      containers:
        - name: proxy
          image: {{ .Values.proxy.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- with .Values.proxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "api-key-manager.proxy.fullname" . }}
