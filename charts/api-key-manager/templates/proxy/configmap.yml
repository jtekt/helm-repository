apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-key-manager.proxy.fullname" . }}
  labels:
    {{- include "api-key-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
data:
  default.conf: |
    server {
      listen 80;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Answered by the proxy itself, so its probes do not depend on the GUI or API
      location = /healthz {
        access_log off;
        return 200;
      }

      location / {
        proxy_pass http://{{ include "api-key-manager.gui.fullname" . }};
      }

      # The trailing slash strips the /api prefix: /api/validate -> /validate
      location /api/ {
        proxy_pass http://{{ include "api-key-manager.api.fullname" . }}/;
      }
    }
